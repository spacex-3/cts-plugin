# Merge this into the existing plugins block in config.yaml.
plugins:
  enabled: true
  dir: plugins
  configs:
    codex-turn-state:
      enabled: true
      priority: 100
      # 兼容单行/多行字符串（也可直接粘贴 JSON 数组）；建议使用下面的 proxies 列表，管理页更直观。
      # 每行一条：host:port:user:password，账号密码可省略（host:port），也可写 socks5://user:pw@host:port。
      proxy: "proxy.example:8080:username:password"
      # proxies:
      #   - "proxy-one.example:8080:user:pass"
      #   - "socks5://proxy-two.example:10000:user:pass"
      # 同一地址可重复填写：动态家宽这类每次连接换 IP 的代理，一条算一个出口，不会被去重。
      # BestGo 这类 SOCKS5 节点，如果 proxies 条目不带协议前缀，请设为 socks5。
      proxy_scheme: "http"
      auth_ids:
        - "codex-auth-id-1"
      probe_auth_ids:
        - "codex-auth-id-1"
      models:
        - "gpt-5.6-sol"
        - "gpt-6-astra"
      # 一张 292 现在只活几分钟，所以间隔默认 2 分钟、调度默认 state_aware：
      # 只在手头这张票进入续期窗口（默认到期前 180 秒）时才真正打票。
      interval_seconds: 120
      probe_schedule: "state_aware"
      probe_lead_seconds: 180
      # 也可用「票龄超过多少秒算可续期」表达续期时机（设 0 表示不用它）：
      state_refresh_seconds: 0
      # 可选：probe_schedule: "on_demand"，空闲时不做定时/启动探测。
      probe_wait_milliseconds: 1500
      probe_timeout_seconds: 60
      on_demand_cooldown_seconds: 600
      use_issued_at: false
      require_completed: false
      error_aware_backoff: false
      quota_backoff_seconds: 900
      rotate_proxy_start: false
      target_state_length: 292
      # 收票门槛：10≈292（Pro/Plus）、12≈332（Team/企业）。
      # 11≈312 是代理/限流出口常见的形态，默认拒绝，不会顶掉你那张 292；
      # 确认 312 也正常后再写成 [10, 11, 12]。
      accepted_blocks: [10, 12]
      # 实测一张 292 只维持约 200 秒，写成 1 小时只会让过期票被继续注入。
      ttl_seconds: 300
      inject: true
      harvest: true
      probe: true
      # 直连探测（0.6 起默认开启）；配合空代理池即为「只用直连探测」。
      direct_probe: true
      # 票与 Cookie：现在的 292 必须带账号级路由 Cookie 才能持续。
      # 只认 __cflb / __oailb，其余 Cookie 一律不采集、不转发、不显示。
      inject_cookies: true
      harvest_cookies: true
      probe_send_cookies: true
      # 上游给了更短的 Max-Age/Expires 就按上游的算，这个值是上限。
      cookie_ttl_seconds: 300
      # 被注入过 state 的请求收到上游拒绝的 state（例如又回 312）时，
      # 立即作废该缓存并触发重探；裸发请求的 312 不会误伤缓存。
      invalidate_on_reject: true
      show_state_values: false
      show_account_details: false
      show_injection_headers: false
      probe_log_limit: 200
      max_probe_attempts: 3
      attempts_per_route: 1
      failure_reprobe_threshold: 3
      prompt: "."
