# Merge this into the existing plugins block in config.yaml.
plugins:
  enabled: true
  dir: plugins
  configs:
    codex-turn-state:
      enabled: true
      priority: 100
      # 兼容单行/多行字符串；建议使用下面的 proxies 列表，管理页更直观。
      proxy: "proxy.example:8080:username:password"
      # proxies:
      #   - "proxy-one.example:8080:user:pass"
      #   - "socks5://proxy-two.example:10000:user:pass"
      # BestGo 这类 SOCKS5 节点，如果 proxies 条目不带协议前缀，请设为 socks5。
      proxy_scheme: "http"
      auth_ids:
        - "codex-auth-id-1"
      probe_auth_ids:
        - "codex-auth-id-1"
      models:
        - "gpt-5.6-sol"
        - "gpt-6-astra"
      interval_seconds: 1800
      probe_schedule: "fixed"
      probe_lead_seconds: 300
      # 可选：probe_schedule: "on_demand"，空闲时不做定时/启动探测。
      probe_wait_milliseconds: 1500
      probe_timeout_seconds: 60
      use_issued_at: false
      require_completed: false
      error_aware_backoff: false
      quota_backoff_seconds: 900
      rotate_proxy_start: false
      target_state_length: 292
      ttl_seconds: 3600
      inject: true
      harvest: true
      probe: true
      direct_probe: true
      show_state_values: false
      show_account_details: false
      show_injection_headers: false
      probe_log_limit: 200
      max_probe_attempts: 3
      failure_reprobe_threshold: 3
      prompt: "."
